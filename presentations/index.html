<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Component Testing Presentations</title>
		<style>
			:root {
				color-scheme: dark;
				font-family: Helvetica, Arial, sans-serif;
			}

			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				background: #111;
				color: #f5f5f5;
			}

			main {
				width: min(640px, calc(100vw - 3rem));
				padding: 2rem;
				border: 1px solid #2a2a2a;
				border-radius: 16px;
				background: #181818;
				box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
			}

			h1 {
				margin-top: 0;
				font-size: 2rem;
			}

			p {
				color: #bdbdbd;
			}

			nav {
				display: grid;
				gap: 1rem;
				margin-top: 2rem;
			}

			a {
				display: block;
				padding: 1rem 1.25rem;
				border-radius: 12px;
				background: #222;
				color: #fff;
				text-decoration: none;
				border: 1px solid #303030;
			}

			a:hover,
			a:focus-visible {
				background: #2d2d2d;
				outline: none;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Component Testing</h1>
			<p>Select a presentation deck.</p>
			<nav>
				<a href="component-testing-1.html">Component Testing 1</a>
				<a href="component-testing-2.html">Component Testing 2</a>
			</nav>
		</main>
	</body>
</html>
